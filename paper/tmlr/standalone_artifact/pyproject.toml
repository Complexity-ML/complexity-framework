[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymous-contextual-wrv"
version = "0.1.0"
description = "Standalone review artifact for contextual Write/Read/Value attention"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "datasets>=2.18",
  "tiktoken>=0.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26"]

[project.scripts]
mini-wrv-train = "mini_wrv.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_wrv*"]
