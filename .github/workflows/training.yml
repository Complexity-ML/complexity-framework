name: Training reliability

on:
  pull_request:
    paths:
      - ".github/workflows/training.yml"
      - "complexity/**"
      - "scripts/pretrain_1b/**"
      - "scripts/pretrain_1b_fsdp/**"
      - "scripts/sync_checkpoints_to_hf.py"
      - "tests/**"
      - "pyproject.toml"
      - "README.md"
      - "docs/**"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - ".github/workflows/training.yml"
      - "complexity/**"
      - "scripts/pretrain_1b/**"
      - "scripts/pretrain_1b_fsdp/**"
      - "scripts/sync_checkpoints_to_hf.py"
      - "tests/**"
      - "pyproject.toml"
      - "README.md"
      - "docs/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      GLOO_SOCKET_IFNAME: lo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU training environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Lint the complete framework package
        run: make lint PYTHON=python
      - name: Check the complete local framework suite
        run: make test PYTHON=python
