name: Training reliability

on:
  pull_request:
    paths:
      - ".github/workflows/training.yml"
      - "complexity/**"
      - "scripts/pretrain_1b/**"
      - "scripts/pretrain_1b_fsdp/**"
      - "scripts/sync_checkpoints_to_hf.py"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/training.yml"
      - "complexity/**"
      - "scripts/pretrain_1b/**"
      - "scripts/pretrain_1b_fsdp/**"
      - "scripts/sync_checkpoints_to_hf.py"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      GLOO_SOCKET_IFNAME: lo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU training environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Lint boundary and flow-control regressions
        run: >-
          ruff check
          scripts/pretrain_1b_fsdp/flow_control.py
          tests/test_training_boundaries.py
          tests/test_pretrain_1b_fsdp_flow_control.py
      - name: Check training, exact resume and two-process coordination
        run: >-
          python -m pytest -q
          tests/test_training.py
          tests/test_training_boundaries.py
          tests/test_training_update_logging.py
          tests/test_pretrain_1b_ddp.py
          tests/test_pretrain_1b_fsdp_flow_control.py
          tests/test_checkpointing_peek.py
          tests/test_sync_checkpoints_to_hf.py
          tests/test_training_runner_device_requirements.py
          tests/test_packed_epoch_contract.py
          tests/test_refinement_stage_contract.py
