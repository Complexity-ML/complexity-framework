name: Detector export

on:
  pull_request:
    paths:
      - ".github/workflows/detector-export.yml"
      - "complexity/deploy/onnx_detector/**"
      - "complexity/generative/detection/**"
      - "complexity/vision/detection/**"
      - "complexity/vision/detection/onnx_release.py"
      - "complexity/vision/detection/onnx_parity.py"
      - "complexity/vision/detection/onnx_inference.py"
      - "complexity/vision/detection/onnx_export.py"
      - "complexity/vision/detection/tensorrt_export.py"
      - "complexity/vision/detection/release.json"
      - "tests/test_detector_export.py"
      - "tests/test_onnx_release.py"
      - "tests/test_onnx_detect_cli.py"
      - "tests/test_onnx_*.py"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/detector-export.yml"
      - "complexity/deploy/onnx_detector/**"
      - "complexity/generative/detection/**"
      - "complexity/vision/detection/**"
      - "complexity/vision/detection/onnx_release.py"
      - "complexity/vision/detection/onnx_parity.py"
      - "complexity/vision/detection/onnx_inference.py"
      - "complexity/vision/detection/onnx_export.py"
      - "complexity/vision/detection/tensorrt_export.py"
      - "complexity/vision/detection/release.json"
      - "tests/test_detector_export.py"
      - "tests/test_onnx_release.py"
      - "tests/test_onnx_detect_cli.py"
      - "tests/test_onnx_*.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  onnx-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,export]"
      - name: Lint detector export code
        run: >-
          ruff check
          complexity/deploy/onnx_detector
          complexity/vision/detection
          tests/test_detector_export.py
          tests/test_onnx_*.py
      - name: Test ONNX branches and dynamic batch parity
        run: >-
          pytest -q
          tests/test_detector_export.py
          tests/test_onnx_*.py
