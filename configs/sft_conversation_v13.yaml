version: 1
seed: 42

# Runtime-only selection. The canonical V13 dataset remains intact.
stages:
  - name: casual-only
    # The source has 420 semantic pairs; 22 are held out by the V13 split.
    max_examples: 398
    epochs: 1
    lr: 2.0e-7
    include_previous: false
    balance_by: task
    batch_size: 32
    seq_len: 384
    filters:
      tasks: [casual_conversation]
      modes: [chat]
      max_structure_occurrences_per_task: 500
      max_opening_occurrences_per_task: 500
      opening_words: 6

  - name: conversation-blend
    # 398 / 568 = 70.1%; weighted selection fills the remainder with an
    # approximately 20/10 empathy/practical split without duplicating rows.
    max_examples: 568
    epochs: 1
    lr: 1.0e-7
    include_previous: true
    balance_by: weighted_task
    task_weights:
      casual_conversation: 0.70
      conversation_empathy: 0.20
      practical_action: 0.10
    batch_size: 32
    seq_len: 384
    filters:
      tasks:
        - casual_conversation
        - conversation_empathy
        - practical_action
      modes: [chat]
      max_structure_occurrences_per_task: 1000
      max_opening_occurrences_per_task: 1000
      opening_words: 6
