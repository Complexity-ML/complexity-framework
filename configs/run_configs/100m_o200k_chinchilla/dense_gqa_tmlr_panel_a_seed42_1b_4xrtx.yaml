run:
  profile: 100m
  dataset: fineweb
  tokenizer: ./tokenizer-o200k

  # Exact TMLR Panel A budget:
  # 954 updates x 4 GPUs x 128 sequences/GPU x 2,048 tokens
  # = 1,000,341,504 training tokens.
  steps: 954
  batch_size: 128
  seq_len: 2048
  hidden_size: 384
  num_hidden_layers: 10
  num_attention_heads: 8
  num_key_value_heads: 2
  attention_type: gqa

  intermediate_size: 1536
  mlp_type: swiglu
  shared_expert: false

  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.1
  max_grad_norm: 0.0
  label_smoothing: 0.0
  z_loss: 0.0

  bf16: true
  grad_ckpt: false
  loss_backend: auto
  loss_chunk_tokens: 1024
  loss_checkpoint_chunks: false
  use_custom_kernels: auto
  cggr: auto
  compile: false

  log_steps: 10
  eval_steps: 250
  eval_batches: 16
  num_workers: 0
  empty_cache_every: 0
  save_steps: 954
  save_total_limit: 1
  seed: 42
  run_name: dense-gqa-tmlr-panel-a-100m-o200k-1b-s42
  save_dir: checkpoints/dense-gqa-tmlr-panel-a-100m-o200k-1b-s42
