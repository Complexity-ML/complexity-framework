run:
  profile: 100m
  dataset: tokens
  tokens_path: data/fineweb_edu_o200k_4b/train
  eval_tokens_path: data/fineweb_edu_o200k_4b/eval
  token_order: sequential
  tokenizer: ./tokenizer-o200k
  eval_ratio: 0.0

  steps: 5086
  batch_size: 48
  seq_len: 2048
  hidden_size: 384
  num_hidden_layers: 10
  num_attention_heads: 8
  num_key_value_heads: 2
  attention_type: gqa

  # Same iso-parameter TR-GQA backbone as the hash-native reference.
  intermediate_size: 128
  shared_intermediate_size: 1520
  mlp_type: token_routed
  expert_initialization: gpt_normal
  paired_dense_init: true
  shared_expert: true
  shared_expert_chunk_tokens: 32768

  # Hash 1: deterministic token-ID pair selection.
  routing_strategy: token_id_balanced_hash
  top_k: 2
  top_k_primary_weight: 0.5
  top_k_primary_weight_final: 0.5
  # Keep the pair mean fixed: learned pair gates retain a large [2N, hidden]
  # tensor per layer for six scalars and exceed the 96 GiB batch-48 budget.
  learn_hash_pair_gates: false
  hash_pair_gate_init: 0.5
  # Hash 2: token/expert/channel signs modulate 128 tiny gains per layer.
  # Zero initialization exactly preserves the reference at step zero.
  learn_hash_channel_modulation: true
  hash_channel_scale_init: 0.0

  learn_shared_routed_gates: false
  shared_output_scale: 1.0
  routed_output_scale: 2.0
  expert_diversity_lambda: 0.0

  optimizer: adamw
  lr: 0.0003
  expert_lr_scale: 2.0
  shared_lr_scale: 1.0
  weight_decay: 0.1
  max_grad_norm: 1.0
  label_smoothing: 0.0
  z_loss: 0.0

  bf16: true
  grad_ckpt: false
  loss_backend: auto
  loss_chunk_tokens: 2048
  loss_checkpoint_chunks: false
  use_custom_kernels: auto
  cggr: auto
  compile: false

  log_steps: 10
  eval_steps: 250
  eval_batches: 32
  num_workers: 0
  empty_cache_every: 0
  save_steps: 1000
  save_total_limit: 2
  seed: 42
  run_name: tr-gqa-paired-active96-multi-hash-100m-o200k-2b-s42
  save_dir: checkpoints/tr-gqa-paired-active96-multi-hash-100m-o200k-2b-s42
