run:
  profile: 100m
  dataset: fineweb
  tokenizer: ./tokenizer-o200k

  # Exact TMLR Panel A budget:
  # 954 updates x 4 GPUs x 128 sequences/GPU x 2,048 tokens
  # = 1,000,341,504 training tokens.
  steps: 954
  batch_size: 128
  seq_len: 2048
  hidden_size: 384
  num_hidden_layers: 10
  num_attention_heads: 8
  num_key_value_heads: 2
  attention_type: gqa

  # Exact reported shared-plus-routed allocation.
  intermediate_size: 768
  shared_intermediate_size: 768
  mlp_type: token_routed
  expert_initialization: legacy_kaiming
  shared_expert: true
  shared_expert_chunk_tokens: 32768
  routing_strategy: modulo_balanced_secondary
  top_k: 2
  top_k_primary_weight: 0.5
  top_k_primary_weight_final: 0.5
  learn_shared_routed_gates: true
  shared_gate_init: 1.0
  routed_gate_init: 0.5
  expert_diversity_lambda: 0.0

  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.1
  max_grad_norm: 0.0
  label_smoothing: 0.0
  z_loss: 0.0

  bf16: true
  grad_ckpt: false
  loss_backend: auto
  loss_chunk_tokens: 1024
  loss_checkpoint_chunks: false
  use_custom_kernels: auto
  cggr: auto
  compile: false

  log_steps: 10
  eval_steps: 250
  eval_batches: 16
  num_workers: 0
  empty_cache_every: 0
  save_steps: 954
  save_total_limit: 1
  seed: 42
  run_name: tr-gqa-tmlr-panel-a-100m-o200k-1b-s42
  save_dir: checkpoints/tr-gqa-tmlr-panel-a-100m-o200k-1b-s42
