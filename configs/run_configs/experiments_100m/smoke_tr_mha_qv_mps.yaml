run:
  profile: 100m
  dataset: text
  text_file: /Users/boris/Dev/complexity-framework/data/local/fineweb_sample.txt
  tokenizer: /Users/boris/Dev/complexity-framework/tokenizer-o200k
  steps: 10
  batch_size: 2
  seq_len: 256
  hidden_size: 384
  num_hidden_layers: 10
  num_attention_heads: 8
  num_key_value_heads: 8
  attention_type: tr_mha
  intermediate_size: 1408
  mlp_type: swiglu
  tr_mha_num_experts: 4
  tr_mha_adapter_rank: 8
  tr_mha_top_k: 2
  tr_mha_adapter_gate_init: 0.1
  tr_mha_id_primary_logit: 2.0
  tr_mha_id_secondary_logit: 1.0
  tr_mha_id_other_logit: -2.0
  tr_mha_verifier_gate_init: 0.1
  tr_mha_verifier_temperature: 1.0
  bf16: true
  grad_ckpt: false
  eval_steps: 10
  eval_batches: 1
  log_steps: 1
  loss_chunk_tokens: 256
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.1
  save_steps: 10
  save_total_limit: 1
  seed: 42
  use_custom_kernels: false
  cggr: false
  run_name: smoke-tr-mha-qv
  save_dir: checkpoints/smoke-tr-mha-qv
