run:
  profile: 100m
  dataset: text
  text_file: /Users/boris/Dev/complexity-framework/data/local/fineweb_sample.txt
  tokenizer: /Users/boris/Dev/complexity-framework/tokenizer-o200k
  steps: 250
  batch_size: 4
  seq_len: 1024
  hidden_size: 384
  num_hidden_layers: 10
  num_attention_heads: 8
  num_key_value_heads: 8
  attention_type: tr_mha_v2
  intermediate_size: 1445
  mlp_type: swiglu
  tr_mha_num_experts: 4
  tr_mha_adapter_rank: 4
  tr_mha_top_k: 2
  tr_mha_targets: v
  tr_mha_adapter_gate_init: 1.0
  tr_mha_id_primary_logit: 2.0
  tr_mha_id_secondary_logit: 1.0
  tr_mha_id_other_logit: -2.0
  tr_mha_verifier_gate_init: 0.1
  tr_mha_verifier_temperature: 1.0
  bf16: true
  grad_ckpt: false
  eval_steps: 50
  eval_batches: 4
  log_steps: 10
  loss_chunk_tokens: 512
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.1
  save_steps: 250
  save_total_limit: 1
  seed: 42
  use_custom_kernels: false
  cggr: false
  run_name: mps-pilot-100m-param-tr-mha-v2-v-only
  save_dir: checkpoints/mps-pilot-100m-param-tr-mha-v2-v-only
