run:
  profile: 100m
  dataset: tokens
  tokens_path: /Users/boris/Dev/fineweb_edu_o200k_4b/train
  eval_tokens_path: /Users/boris/Dev/fineweb_edu_o200k_4b/eval
  token_order: sequential
  tokenizer: ./tokenizer-o200k
  eval_ratio: 0.0

  steps: 600
  batch_size: 4
  seq_len: 1024
  hidden_size: 384
  num_hidden_layers: 10
  num_attention_heads: 8
  num_key_value_heads: 2
  attention_type: gqa
  intermediate_size: 256
  shared_intermediate_size: 1392
  mlp_type: token_routed
  shared_expert: true
  shared_expert_chunk_tokens: 32768
  routing_strategy: modulo_cyclic
  top_k: 2
  top_k_primary_weight: 0.5
  top_k_primary_weight_final: 0.5
  learn_shared_routed_gates: false
  expert_diversity_lambda: 0.0

  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.1
  max_grad_norm: 1.0
  label_smoothing: 0.0
  z_loss: 0.0

  bf16: true
  grad_ckpt: false
  loss_backend: chunked
  loss_chunk_tokens: 2048
  loss_checkpoint_chunks: false
  use_custom_kernels: false
  cggr: false
  compile: false

  log_steps: 10
  eval_steps: 100
  eval_batches: 4
  num_workers: 0
  empty_cache_every: 0
  save_steps: 0
  save_total_limit: 1
  seed: 42
  run_name: diagnostic-mps-tr-gqa-modulo-cyclic-o200k-s42
  save_dir: checkpoints/diagnostic-mps-tr-gqa-modulo-cyclic-o200k-s42
