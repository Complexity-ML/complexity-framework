run:
  profile: 100m
  dataset: fineweb
  tokenizer: ./tokenizer-o200k
  steps: 7200
  batch_size: 256
  seq_len: 2048
  bf16: true
  grad_ckpt: false
  eval_steps: 200
  eval_batches: 16
  log_steps: 10
  save_steps: 200
  save_total_limit: 3
  loss_chunk_tokens: 1024
  routing_strategy: token_id_composed_modulo
  run_name: 30b-100m-o200k-tr-8b300-b256
  save_dir: checkpoints/30b-100m-o200k-tr-8b300-b256
  mlp_type: tr_hash_engine
  num_attention_heads: 4
  num_key_value_heads: 1
  num_experts: 4
  top_k: 2
  top_k_primary_weight: 0.5
  shared_expert: true
  shared_output_scale: 1.0
  routed_output_scale: 2.0
  use_qk_norm: true
