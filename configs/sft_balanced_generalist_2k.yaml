version: 1
seed: 42

# One-epoch diagnostic for general instruction following. The runtime selector
# draws evenly from all 14 task families in the existing V12 32k shard; it
# does not create or publish a derivative dataset.
stages:
  - name: generalist-2k
    max_examples: 2000
    epochs: 1
    lr: 1.0e-6
    batch_size: 32
    seq_len: 320
    balance_by: task
    filters:
      max_num_tokens: 320
      max_supervised_tokens: 144
      max_structure_occurrences_per_task: 1
      max_opening_occurrences_per_task: 7
      opening_words: 6
      opening_cap_exempt_tasks: [extraction_classification]
      exclude_response_substrings:
        - "what should carry forward is"
        - "this also makes explicit that"
        - "the answer stays useful only"
        - "a useful final check confirms"
        - "completion should follow the next"
        - "the practical implication is that"
        - "this distinction matters because"
        - "the supported takeaway is that"
        - "the conclusion remains bounded"
        - "the next reader can verify"
