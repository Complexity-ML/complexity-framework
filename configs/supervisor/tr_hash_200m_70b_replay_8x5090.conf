[program:tr_hash_200m_70b_replay]
directory=/workspace/complexity-framework
; The launch wrapper (/workspace/run_200m.sh) is instance-local, not tracked
; in git: it exports HF_TOKEN alongside the rest of the run's env vars, and a
; secret must never sit in a file committed to this public repo.
command=/bin/bash /workspace/run_200m.sh
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=300
redirect_stderr=true
stdout_logfile=/workspace/complexity-framework/artifacts/tr_hash_200m_70b_replay.log
; Unbounded, matching the detection project's supervisor confs: the
; line-mode logger now emits one compact line per log_steps interval
; instead of a raw tqdm bar dump, so the log grows slowly enough that
; losing history to rotation costs more than it saves.
stdout_logfile_maxbytes=0
