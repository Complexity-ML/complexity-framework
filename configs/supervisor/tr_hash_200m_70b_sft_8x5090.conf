[program:tr_hash_200m_70b_sft]
directory=/workspace/complexity-framework
; The launch wrapper (/workspace/run_200m_sft.sh) is instance-local, not
; tracked in git: it exports HF_TOKEN and INIT_CHECKPOINT alongside the rest
; of the run's env vars, and a secret must never sit in a file committed to
; this public repo. It calls
; scripts/vast_finetune_tr_hash_200m_70b_unique_phase2.sh.
command=/bin/bash /workspace/run_200m_sft.sh
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=300
redirect_stderr=true
stdout_logfile=/workspace/complexity-framework/artifacts/tr_hash_200m_70b_sft.log
; Unbounded, matching the other 200M supervisor confs: the line-mode logger
; emits one compact line per log_steps interval, so the log grows slowly
; enough that losing history to rotation costs more than it saves.
stdout_logfile_maxbytes=0
