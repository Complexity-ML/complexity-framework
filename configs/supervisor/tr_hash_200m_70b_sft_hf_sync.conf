[program:tr_hash_200m_70b_sft_hf_sync]
directory=/workspace/complexity-framework
; Same secret-isolation rationale as tr_hash_200m_70b_replay_hf_sync.conf:
; this instance-local wrapper exports HF_TOKEN and is not tracked in git.
; Points sync_checkpoints_to_hf.py at the phase-2 SFT checkpoint dir
; (artifacts/tr_hash_200m_70b_unique_phase2) and repo-id
; AETHORIA-AI/TR-HASH-200M-70B-SFT.
command=/bin/bash /workspace/sync_checkpoints_sft.sh
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/workspace/complexity-framework/artifacts/tr_hash_200m_70b_sft_hf_sync.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
