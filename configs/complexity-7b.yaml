# Complexity 7B Configuration
# Canonical TR-HASH decoder architecture

# Architecture
hidden_size: 4096
num_hidden_layers: 32
num_attention_heads: 4
num_key_value_heads: 1
intermediate_size: 11008
vocab_size: 100000

# Attention
attention_type: gqa
attention_dropout: 0.0
use_qk_norm: true  # QK Normalization for stability
sliding_window: null  # Full attention

# Position
max_position_embeddings: 8192
rope_theta: 10000.0
rope_type: standard

# Shared and composed-routed SwiGLU
mlp_type: tr_hash_engine
hidden_act: silu
num_experts: 4  # 4 experts, deterministic routing
top_k: 2
top_k_primary_weight: 0.5
shared_expert: true
shared_output_scale: 1.0
routed_output_scale: 2.0
routing_strategy: token_id_composed_modulo

# Normalization
norm_type: rmsnorm
norm_eps: 1.0e-6

# Other
tie_word_embeddings: true
use_sdpa: true
initializer_range: 0.02
