[program:tr_hash_500m_32k_sft]
command=/workspace/complexity-framework/scripts/vast_sft_500m_32k_tr.sh
directory=/workspace/complexity-framework
environment=PYTHONUNBUFFERED="1",HF_XET_HIGH_PERFORMANCE="1",NCCL_ASYNC_ERROR_HANDLING="1"
autostart=false
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/workspace/complexity-framework/artifacts/tr_hash_500m_32k_sft.log
