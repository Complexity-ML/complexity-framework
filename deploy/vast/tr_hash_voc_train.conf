[program:tr_hash_voc_train]
environment=PROC_NAME="%(program_name)s"
command=/workspace/complexity-framework/scripts/vast_sft_voc_v03.sh
directory=/workspace/complexity-framework
autostart=false
autorestart=unexpected
startretries=3
startsecs=5
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/complexity-framework/artifacts/tr_hash_pipeline.log
stdout_logfile_maxbytes=52428800
stdout_logfile_backups=1
redirect_stderr=true
